name: Check week pages

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every week in weeks.js has its /week-N/ page
        run: node tools/sync-weeks.js --check
