<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Exercises</title>
<!-- Old link format (week.html?w=17). Sends you to the new address, /week-17/. -->
<script>
  const w = new URLSearchParams(location.search).get("w");
  location.replace(/^\d+$/.test(w || "") ? `week-${w}/` : "./");
</script>
</head>
<body><a href="./">Go to all weeks</a></body>
</html>
