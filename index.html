<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Exercises</title>
<meta name="description" content="My weekly exercise programme. Pick a week and tap any exercise to watch the demo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exercises">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --accent: #2f6f5e;
    --accent-2: #4e9a7f;
    --accent-soft: #e3efe9;
    --warm: #e8875b;
    --border: #e4e2dc;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
    --hero-from: #2f6f5e;
    --hero-to: #1f4d5c;
    --track: #e9e7e1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416;
      --card: #1e1e21;
      --text: #f0f0f2;
      --muted: #a0a0a8;
      --accent: #6cc3a7;
      --accent-2: #4e9a7f;
      --accent-soft: #1f3530;
      --warm: #f0a07a;
      --border: #2c2c31;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
      --hero-from: #1f4d43;
      --hero-to: #173544;
      --track: #2c2c31;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416;
    --card: #1e1e21;
    --text: #f0f0f2;
    --muted: #a0a0a8;
    --accent: #6cc3a7;
    --accent-2: #4e9a7f;
    --accent-soft: #1f3530;
    --warm: #f0a07a;
    --border: #2c2c31;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --hero-from: #1f4d43;
    --hero-to: #173544;
    --track: #2c2c31;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 760px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px 48px;
  }

  .greeting { font-size: .95rem; color: var(--muted); margin: 0; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 4px 0 22px; letter-spacing: -.02em; }
  h1 .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 1.8s ease-in-out 0.4s 1; }
  @keyframes wave { 0%,100% { transform: rotate(0); } 20%,60% { transform: rotate(14deg); } 40%,80% { transform: rotate(-8deg); } }

  /* Featured week */
  .hero {
    position: relative; display: block; overflow: hidden; color: #fff; text-decoration: none;
    border-radius: 22px; padding: 22px 20px 20px;
    background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.14), transparent 60%),
                linear-gradient(145deg, var(--hero-from), var(--hero-to));
    box-shadow: 0 10px 30px rgba(31,77,67,.28);
    transition: transform .15s ease;
  }
  .hero:active { transform: scale(.99); }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .eyebrow {
    display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    background: rgba(255,255,255,.16); padding: 4px 10px; border-radius: 999px;
  }
  .big { font-size: 3.4rem; font-weight: 800; line-height: 1; margin: 12px 0 4px; letter-spacing: -.03em; }
  .hero .meta { opacity: .85; font-size: .95rem; margin: 0; }

  .ring { flex: none; position: relative; width: 92px; height: 92px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bg { stroke: rgba(255,255,255,.18); }
  .ring .fg { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
  .ring-label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
  .ring-label b { font-size: 1.3rem; display: block; }
  .ring-label span { font-size: .7rem; opacity: .85; }

  .thumbs { display: flex; margin: 18px 0 16px; }
  .thumbs span {
    width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9);
    background: #000 center / cover no-repeat; margin-left: -10px;
  }
  .thumbs span:first-child { margin-left: 0; }
  .thumbs .more {
    display: grid; place-items: center; font-size: .8rem; font-weight: 700;
    background: rgba(255,255,255,.2); color: #fff;
  }

  .cta {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; color: var(--hero-to); border-radius: 14px; padding: 14px 16px; font-weight: 700;
  }
  .cta .arrow { transition: transform .2s; }
  .hero:hover .cta .arrow { transform: translateX(4px); }

  /* Coach's cue */
  .cue {
    margin: 18px 0 30px; padding: 16px 18px; border-radius: 16px; background: var(--card);
    border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; gap: 14px; align-items: flex-start;
  }
  .cue .icon { font-size: 1.5rem; line-height: 1; }
  .cue h3 { margin: 0 0 2px; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--warm); }
  .cue p { margin: 0; }
  .cue small { color: var(--muted); }
  .cue button {
    margin-left: auto; flex: none; border: 0; background: none; color: var(--muted); font-size: 1.1rem;
    cursor: pointer; padding: 4px; border-radius: 8px;
  }
  .cue button:hover { color: var(--accent); background: var(--accent-soft); }

  /* All weeks */
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  .weeks { display: grid; gap: 10px; }
  .week {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
    color: var(--text); text-decoration: none; transition: transform .15s, border-color .15s;
  }
  .week:hover { border-color: var(--accent); transform: translateY(-1px); }
  .badge {
    flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    font-weight: 800; font-size: 1.15rem; background: var(--accent-soft); color: var(--accent);
  }
  .week.complete .badge { background: var(--accent); color: #fff; }
  .week .info { flex: 1; min-width: 0; }
  .week .name { font-weight: 700; }
  .week .sub { color: var(--muted); font-size: .85rem; }
  .bar { height: 6px; border-radius: 999px; background: var(--track); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .8s ease; }
  .chev { color: var(--muted); font-size: 1.2rem; }

  footer { margin-top: 34px; color: var(--muted); font-size: .85rem; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 400px) {
    .big { font-size: 2.8rem; }
    .ring { width: 80px; height: 80px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="greeting" id="greeting"></p>
  <h1 id="headline"></h1>

  <a class="hero" id="hero"></a>

  <div class="cue" id="cue" hidden>
    <div class="icon" aria-hidden="true">💡</div>
    <div>
      <h3>Coach's cue</h3>
      <p id="cue-text"></p>
      <small id="cue-src"></small>
    </div>
    <button type="button" id="cue-next" aria-label="Show another cue">↻</button>
  </div>

  <h2>All weeks</h2>
  <div class="weeks" id="weeks"></div>

  <footer>Tap a week to see its exercises. Your progress is saved on this device.</footer>
</div>

<script src="weeks.js"></script>
<script>
  const weeks = [...WEEKS].sort((a, b) => b.number - a.number);
  const latest = weeks[0];

  const progress = (w) => {
    const names = new Set(w.exercises.map(e => e.name));
    const done = Store.get(Store.doneKey(w.number), []).filter(n => names.has(n)).length;
    return { done, total: w.exercises.length, pct: w.exercises.length ? done / w.exercises.length : 0 };
  };
  const videoCount = (w) => w.exercises.reduce((n, e) => n + e.videos.length, 0);
  const href = (w) => `week.html?w=${w.number}`;

  // Greeting and headline
  const h = new Date().getHours();
  document.getElementById("greeting").textContent =
    h < 5 ? "Up late" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const p = progress(latest);
  document.getElementById("headline").innerHTML =
    p.done === 0 ? `Ready to move? <span class="wave">👋</span>`
    : p.done < p.total ? `Nice work, keep going <span class="wave">💪</span>`
    : `Week ${latest.number} done <span class="wave">🎉</span>`;

  // Featured week
  const R = 40, C = 2 * Math.PI * R;
  const thumbs = latest.exercises.slice(0, 5)
    .map(e => `<span style="background-image:url('https://i.ytimg.com/vi/${e.videos[0].id}/default.jpg')"></span>`).join("")
    + (latest.exercises.length > 5 ? `<span class="more">+${latest.exercises.length - 5}</span>` : "");
  const cta = p.done === 0 ? "Start workout" : p.done < p.total ? "Continue workout" : "Review this week";
  const hero = document.getElementById("hero");
  hero.href = href(latest);
  hero.innerHTML = `
    <div class="hero-top">
      <div>
        <span class="eyebrow">This week</span>
        <div class="big">Week ${latest.number}</div>
        <p class="meta">${p.total} exercises · ${videoCount(latest)} videos</p>
      </div>
      <div class="ring" role="img" aria-label="${p.done} of ${p.total} exercises done">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="${R}"/>
          <circle class="fg" cx="50" cy="50" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="ring-label"><div><b>${p.done}/${p.total}</b><span>done</span></div></div>
      </div>
    </div>
    <div class="thumbs" aria-hidden="true">${thumbs}</div>
    <div class="cta"><span>${cta}</span><span class="arrow">→</span></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    hero.querySelector(".fg").style.strokeDashoffset = C * (1 - p.pct);
  }));

  // Coach's cue: a random tip from any week
  const cues = WEEKS.flatMap(w => w.exercises.flatMap(e => (e.tips || []).map(t => ({ t, e: e.name, w: w.number }))));
  if (cues.length) {
    let last = -1;
    const show = () => {
      let i;
      do { i = Math.floor(Math.random() * cues.length); } while (cues.length > 1 && i === last);
      last = i;
      document.getElementById("cue-text").textContent = cues[i].t;
      document.getElementById("cue-src").textContent = `${cues[i].e} · Week ${cues[i].w}`;
    };
    show();
    document.getElementById("cue").hidden = false;
    document.getElementById("cue-next").addEventListener("click", show);
  }

  // All weeks list, newest first
  const list = document.getElementById("weeks");
  weeks.forEach(w => {
    const wp = progress(w);
    const a = document.createElement("a");
    a.className = "week" + (wp.done === wp.total && wp.total ? " complete" : "");
    a.href = href(w);
    a.innerHTML = `
      <div class="badge">${wp.done === wp.total && wp.total ? "✓" : w.number}</div>
      <div class="info">
        <div class="name">Week ${w.number}${w === latest ? " · current" : ""}</div>
        <div class="sub">${wp.done} of ${wp.total} done · ${w.exercises.map(e => e.name).slice(0, 3).join(", ")}${w.exercises.length > 3 ? "…" : ""}</div>
        <div class="bar"><i></i></div>
      </div>
      <span class="chev" aria-hidden="true">›</span>`;
    list.appendChild(a);
    requestAnimationFrame(() => requestAnimationFrame(() => { a.querySelector(".bar i").style.width = `${wp.pct * 100}%`; }));
  });

  // Refresh progress when returning to this page from a week (iOS restores pages from cache).
  window.addEventListener("pageshow", (e) => { if (e.persisted) location.reload(); });
</script>
</body>
</html>
