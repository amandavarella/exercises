<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Exercises</title>
<meta name="description" content="Quick reference for my exercise programme. Tap any exercise to watch the demo video.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --accent: #2f6f5e;
    --accent-soft: #e3efe9;
    --border: #e4e2dc;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
    --overlay: rgba(10,10,12,.85);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416;
      --card: #1e1e21;
      --text: #f0f0f2;
      --muted: #a0a0a8;
      --accent: #6cc3a7;
      --accent-soft: #1f3530;
      --border: #2c2c31;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416;
    --card: #1e1e21;
    --text: #f0f0f2;
    --muted: #a0a0a8;
    --accent: #6cc3a7;
    --accent-soft: #1f3530;
    --border: #2c2c31;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 1.75rem; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: .95rem; }
  .progress { font-size: .9rem; color: var(--muted); white-space: nowrap; }
  .progress button + button { margin-left: 4px; }
  .progress button {
    margin-left: 8px; font: inherit; font-size: .85rem; color: var(--accent);
    background: none; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
    transition: opacity .2s;
  }
  .card.done { opacity: .55; }
  .card.dragging { opacity: .9; box-shadow: 0 12px 32px rgba(0,0,0,.25); outline: 2px solid var(--accent); position: relative; z-index: 2; }
  body.is-dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }

  .handle {
    flex: none; width: 30px; height: 30px; border: 0; border-radius: 8px; padding: 0;
    background: none; color: var(--muted); cursor: grab; display: grid; place-items: center;
    touch-action: none;
  }
  .handle:hover, .handle:focus-visible { background: var(--accent-soft); color: var(--accent); }
  .handle svg { width: 18px; height: 18px; fill: currentColor; }
  .title-row h2 { flex: 1; }

  .thumb {
    position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0;
    background: #000 center / cover no-repeat; cursor: pointer;
  }
  .thumb::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0) 55%);
  }
  .play {
    position: absolute; z-index: 1; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.92);
    display: grid; place-items: center; transition: transform .15s;
  }
  .play svg { width: 22px; height: 22px; margin-left: 3px; fill: #111; }
  .thumb:hover .play, .thumb:focus-visible .play { transform: translate(-50%, -50%) scale(1.08); }
  .thumb:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .badge {
    position: absolute; z-index: 1; left: 10px; bottom: 8px; color: #fff; font-size: .75rem;
    font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
  }

  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h2 { font-size: 1.1rem; margin: 0; }
  .check {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border);
    background: none; cursor: pointer; display: grid; place-items: center; color: transparent;
  }
  .check svg { width: 16px; height: 16px; }
  .card.done .check { background: var(--accent); border-color: var(--accent); color: #fff; }

  .tips { margin: 0; padding: 10px 12px; background: var(--accent-soft); border-radius: 10px; font-size: .92rem; }
  .tips p { margin: 0; }
  .tips p + p { margin-top: 6px; }

  .alt { display: flex; flex-wrap: wrap; gap: 8px; }
  .alt button {
    font: inherit; font-size: .85rem; color: var(--accent); background: none; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
  }

  /* Video modal */
  .modal {
    position: fixed; inset: 0; z-index: 10; background: var(--overlay);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal.open { display: flex; }
  .player { position: relative; width: 100%; max-width: 900px; }
  .player.short { max-width: min(420px, calc((100vh - 120px) * 9 / 16)); }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
  .player.short .frame { aspect-ratio: 9 / 16; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; color: #fff; }
  .player-bar h3 { margin: 0; font-size: 1rem; }
  .player-bar a { color: #cfe; font-size: .85rem; }
  .close {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.15); color: #fff; font-size: 1.4rem; line-height: 1;
  }

  footer { margin-top: 32px; color: var(--muted); font-size: .85rem; text-align: center; }

  @media (max-width: 520px) {
    header { flex-direction: column; align-items: flex-start; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>My Exercises</h1>
      <p class="sub">Tap any exercise to watch the demo. Drag the ⠿ handle to reorder.</p>
    </div>
    <div class="progress"><span id="count"></span><button id="reset" type="button">Reset ticks</button><button id="reset-order" type="button">Reset order</button></div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>Tick each exercise off as you go. Your progress and order are saved on this device.</footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="player" id="player">
    <div class="player-bar">
      <div>
        <h3 id="modal-title"></h3>
        <a id="modal-link" href="#" target="_blank" rel="noopener">Open in YouTube</a>
      </div>
      <button class="close" id="close" type="button" aria-label="Close video">&times;</button>
    </div>
    <div class="frame" id="frame"></div>
  </div>
</div>

<script>
  // Add or edit exercises here. "short: true" means a vertical YouTube Short.
  const EXERCISES = [
    {
      name: "Lying Press",
      videos: [{ id: "d33SDkfL1yQ", short: true }]
    },
    {
      name: "Single Arm Row",
      videos: [{ id: "i9BJwVCK5VQ", short: true }]
    },
    {
      name: "Pallof Press (Banded)",
      videos: [{ id: "y1fOBVtANdM", short: false }]
    },
    {
      name: "Standing Banded Abduction",
      tips: [
        "Keep your trunk nice and straight as you abduct (move away) the leg.",
        "Use whichever band feels best or that you have access to. A long band needs to be tied."
      ],
      videos: [
        { id: "8Ax7lJ3I7pk", short: true, label: "Friend demo (small band)" },
        { id: "7Sph-K6Nmgc", short: true, label: "Long band version" }
      ]
    },
    {
      name: "Alternating Lunges",
      videos: [{ id: "tTej-ax9XiA", short: false }]
    },
    {
      name: "Glute Bridge with Band Abduction",
      tips: [
        "Before you come up, pelvic tilt first: bring the top of your hips toward your belly button and squeeze your bum.",
        "Then drive up into the glute bridge end position.",
        "From the top, abduct your knees out against the band."
      ],
      videos: [{ id: "tv9dFw4zPA0", short: true }]
    },
    {
      name: "Squat with a Band",
      tips: ["Band goes above the knees."],
      videos: [{ id: "ExfeIVSC1HU", short: true }]
    }
  ];

  const STORE_KEY = "exercises-done";
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } };
  const save = (done) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(done)); } catch {} };
  let done = new Set(load());

  const ORDER_KEY = "exercises-order";
  const loadOrder = () => { try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; } catch { return []; } };
  const saveOrder = (order) => { try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch {} };

  // Apply the saved order. Exercises not in the saved list (e.g. newly added) go at the end.
  const savedOrder = loadOrder();
  const rank = (ex) => { const i = savedOrder.indexOf(ex.name); return i === -1 ? Infinity : i; };
  const ordered = EXERCISES.map((ex, i) => ({ ex, i })).sort((a, b) => rank(a.ex) - rank(b.ex) || a.i - b.i).map(o => o.ex);

  const ytUrl = (v) => v.short ? `https://www.youtube.com/shorts/${v.id}` : `https://www.youtube.com/watch?v=${v.id}`;
  const playIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  const gripIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
  const tickIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>';

  const grid = document.getElementById("grid");

  ordered.forEach((ex) => {
    const main = ex.videos[0];
    const card = document.createElement("article");
    card.dataset.name = ex.name;
    card.className = "card" + (done.has(ex.name) ? " done" : "");
    card.innerHTML = `
      <button class="thumb" type="button" aria-label="Play ${ex.name} video"
        style="background-image:url('https://i.ytimg.com/vi/${main.id}/hqdefault.jpg')">
        <span class="play">${playIcon}</span>
        <span class="badge"><span class="num"></span>${main.short ? " · Short" : ""}</span>
      </button>
      <div class="body">
        <div class="title-row">
          <button class="handle" type="button" aria-label="Reorder ${ex.name}. Drag, or use arrow keys">${gripIcon}</button>
          <h2>${ex.name}</h2>
          <button class="check" type="button" aria-label="Mark ${ex.name} as done" aria-pressed="${done.has(ex.name)}">${tickIcon}</button>
        </div>
        ${ex.tips ? `<div class="tips">${ex.tips.map(t => `<p>${t}</p>`).join("")}</div>` : ""}
        ${ex.videos.length > 1 ? `<div class="alt">${ex.videos.map((v, j) =>
          `<button type="button" data-v="${j}">▶ ${v.label || "Video " + (j + 1)}</button>`).join("")}</div>` : ""}
      </div>`;

    card.querySelector(".thumb").addEventListener("click", () => openVideo(ex, main));
    card.querySelectorAll(".alt button").forEach(b =>
      b.addEventListener("click", () => openVideo(ex, ex.videos[+b.dataset.v])));
    const check = card.querySelector(".check");
    check.addEventListener("click", () => {
      done.has(ex.name) ? done.delete(ex.name) : done.add(ex.name);
      card.classList.toggle("done", done.has(ex.name));
      check.setAttribute("aria-pressed", done.has(ex.name));
      save([...done]);
      updateCount();
    });
    setupDrag(card);
    grid.appendChild(card);
  });
  renumber();

  function renumber() {
    grid.querySelectorAll(".card").forEach((c, i) => {
      c.querySelector(".num").textContent = String(i + 1).padStart(2, "0");
    });
  }
  function persistOrder() {
    saveOrder([...grid.querySelectorAll(".card")].map(c => c.dataset.name));
    renumber();
  }

  // Drag to reorder with the handle. Pointer events cover mouse, touch, and pen.
  function setupDrag(card) {
    const handle = card.querySelector(".handle");

    handle.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      card.classList.add("dragging");
      document.body.classList.add("is-dragging");

      const onMove = (ev) => {
        // Auto-scroll near the top or bottom edge of the screen.
        const edge = 60;
        if (ev.clientY < edge) window.scrollBy(0, -12);
        else if (ev.clientY > window.innerHeight - edge) window.scrollBy(0, 12);

        const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".card");
        if (!target || target === card) return;
        const cards = [...grid.children];
        const before = cards.indexOf(card) > cards.indexOf(target);
        grid.insertBefore(card, before ? target : target.nextSibling);
      };
      // Listen on the document: moving the card in the DOM would drop pointer capture on the handle.
      const onUp = () => {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        card.classList.remove("dragging");
        document.body.classList.remove("is-dragging");
        persistOrder();
      };
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });

    // Keyboard: arrow keys move the card one place.
    handle.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowLeft"].includes(e.key) && card.previousElementSibling) {
        grid.insertBefore(card, card.previousElementSibling);
      } else if (["ArrowDown", "ArrowRight"].includes(e.key) && card.nextElementSibling) {
        grid.insertBefore(card.nextElementSibling, card);
      } else return;
      e.preventDefault();
      handle.focus();
      persistOrder();
    });
  }

  document.getElementById("reset-order").addEventListener("click", () => {
    const byName = Object.fromEntries([...grid.children].map(c => [c.dataset.name, c]));
    EXERCISES.forEach(ex => grid.appendChild(byName[ex.name]));
    persistOrder();
  });

  function updateCount() {
    document.getElementById("count").textContent = `${done.size} / ${EXERCISES.length} done`;
  }
  updateCount();

  document.getElementById("reset").addEventListener("click", () => {
    done.clear(); save([]);
    document.querySelectorAll(".card").forEach(c => c.classList.remove("done"));
    document.querySelectorAll(".check").forEach(c => c.setAttribute("aria-pressed", "false"));
    updateCount();
  });

  // Modal player
  const modal = document.getElementById("modal");
  const player = document.getElementById("player");
  const frame = document.getElementById("frame");
  let lastFocus = null;

  function openVideo(ex, v) {
    lastFocus = document.activeElement;
    document.getElementById("modal-title").textContent = ex.name + (v.label ? ` · ${v.label}` : "");
    document.getElementById("modal-link").href = ytUrl(v);
    player.classList.toggle("short", v.short);
    frame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1"
      title="${ex.name}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    modal.classList.add("open");
    document.getElementById("close").focus();
  }
  function closeVideo() {
    modal.classList.remove("open");
    frame.innerHTML = "";
    if (lastFocus) lastFocus.focus();
  }
  document.getElementById("close").addEventListener("click", closeVideo);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeVideo(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("open")) closeVideo(); });
</script>
</body>
</html>
